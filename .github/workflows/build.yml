name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TERM: xterm
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Install Rust with Android targets
        run: |
          mkdir -p /tmp/fakebin
          printf '#!/bin/sh\nexit 0\n' > /tmp/fakebin/tput
          chmod +x /tmp/fakebin/tput
          export PATH=/tmp/fakebin:$PATH
          scripts/setup-rust.sh
      - name: Setup SDK/NDK and local.properties
        env:
          TELEGRAM_API_ID: ${{ secrets.TG_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TG_API_HASH }}
          APP_ID: org.thunderdog.challegram
          APP_NAME: Telegram X
          APP_DOWNLOAD_URL: https://github.com/AlanChuaDev/Telegram-X/releases
          APP_SOURCES_URL: https://github.com/AlanChuaDev/Telegram-X
          KEYSTORE_FILE: /tmp/keystore.properties
        run: |
          export PATH=/tmp/fakebin:$PATH
          touch /tmp/keystore.properties
          scripts/setup.sh
          echo "app.disable_signing=true" >> local.properties
          echo "---- local.properties (hash hidden) ----"
          sed 's/telegram.api_hash=.*/telegram.api_hash=***/' local.properties
      - name: Build
        run: ./gradlew :app:assembleLatestDebug -Pabi=arm64
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-x-apk
          path: app/build/outputs/apk/**/*.apk
