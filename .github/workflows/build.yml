name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TERM: xterm
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Create keystore
        run: |
          keytool -genkeypair -keystore /tmp/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > /tmp/keystore.properties <<EOF
          keystore.file=/tmp/debug.keystore
          keystore.password=android
          key.alias=androiddebugkey
          key.password=android
          EOF
      - name: Setup SDK/NDK/Rust and local.properties
        env:
          TELEGRAM_API_ID: ${{ secrets.TG_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TG_API_HASH }}
          APP_ID: org.thunderdog.challegram
          APP_NAME: Telegram X
          APP_DOWNLOAD_URL: https://github.com/AlanChuaDev/Telegram-X/releases
          APP_SOURCES_URL: https://github.com/AlanChuaDev/Telegram-X
          KEYSTORE_FILE: /tmp/keystore.properties
        run: |
          mkdir -p /tmp/fakebin
          printf '#!/bin/sh\nexit 0\n' > /tmp/fakebin/tput
          chmod +x /tmp/fakebin/tput
          export PATH=/tmp/fakebin:$PATH
          scripts/setup.sh
      - name: Build
        run: ./gradlew :app:assembleLatestDebug -Pabi=arm64
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-x-apk
          path: app/build/outputs/apk/**/*.apk
